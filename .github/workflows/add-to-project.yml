name: Add to project

on:
  issues:
    types: [opened]

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        id: add
        with:
          project-url: https://github.com/users/alvarofpp/projects/3
          github-token: ${{ secrets.PROJECT_PAT }}

      # O workflow embutido do project só seta Status; Priority tem que vir daqui.
      - name: Set priority
        if: steps.add.outputs.itemId != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project, itemId: $item, fieldId: $field,
                value: { singleSelectOptionId: $option }
              }) { projectV2Item { id } }
            }' \
            -f project=PVT_kwHOAKUO1s4BhWjn \
            -f item="${{ steps.add.outputs.itemId }}" \
            -f field=PVTSSF_lAHOAKUO1s4BhWjnzhgSlyk \
            -f option=724ae565
